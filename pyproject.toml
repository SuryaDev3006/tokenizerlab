[project]
name = "tokenizerlab"
version = "0.1.0"
description = "Reproducible tokenizer experiments: deterministic, inspectable corpus building for tokenizer training."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Surya Teja Manthri" }]
keywords = ["tokenizer", "tokenization", "bpe", "byte-pair-encoding", "nlp", "llm", "multilingual", "corpus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SuryaDev3006/tokenizerlab"
Repository = "https://github.com/SuryaDev3006/tokenizerlab"
Issues = "https://github.com/SuryaDev3006/tokenizerlab/issues"

[project.optional-dependencies]
# Floors are the oldest releases that have the APIs used and wheels for Python 3.11.
parquet = [
    "pyarrow>=10.0",  # Table.from_pylist (7.0), iter_batches (3.0); 3.11 wheels from 10.0
]
hf = [
    "datasets>=2.0",  # load_dataset(streaming=True, revision=...)
    "huggingface_hub>=0.10",  # HfApi().dataset_info(revision=...).sha, imported directly
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pyarrow>=10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizerlab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "N",        # naming
    "B",        # bugbear
    "UP",       # modern syntax
    "SIM",      # simplifications
    "C90",      # cyclomatic complexity
    "PL",       # pylint: argument, branch and statement limits
    "FBT",      # boolean traps
    "BLE",      # blind except
    "RUF",
]
ignore = [
    "PLR2004",  # magic values: constants that only appear once read better inline
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 60
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "FBT"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "datasets.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
